<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda 3DGS Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  #tip { position: fixed; left: 12px; bottom: 10px; color: #aaa; font: 13px/1.4 system-ui, sans-serif; z-index: 10; }
</style>
</head>
<body>
<div id="tip">鼠标左键拖动旋转 · 滚轮缩放 · 右键拖动平移</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

window.sceneReady = false;
window.sceneError = '';

const viewer = new GaussianSplats3D.Viewer({
  'sharedMemoryForWorkers': false
});
window.viewer = viewer;

viewer.addSplatScene('panda_cleaned.ply', {
  'format': GaussianSplats3D.SceneFormat.Ply
}).then(() => {
  viewer.start();

  // start() 之后再把相机对准场景（否则会被 start() 重置回默认位置）
  try {
    const mesh = viewer.splatMesh;
    const n = mesh.getSplatCount();
    const step = Math.max(1, Math.floor(n / 2000));
    const v = new THREE.Vector3();
    const min = new THREE.Vector3(Infinity, Infinity, Infinity);
    const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
    for (let i = 0; i < n; i += step) {
      mesh.getSplatCenter(i, v);
      min.min(v);
      max.max(v);
    }
    const center = new THREE.Vector3().addVectors(min, max).multiplyScalar(0.5);
    const radius = Math.max(
      max.x - min.x, max.y - min.y, max.z - min.z
    ) || 1;
    window.sceneBox = { center: center.toArray(), radius };

    const cam = viewer.camera;
    // COLMAP 场景 Y 轴朝下，相机从下方看才是正的
    cam.up.set(0, -1, 0);
    cam.position.set(center.x, center.y - radius * 0.3, center.z - radius * 1.6);
    cam.lookAt(center);
    if (viewer.orbitControls) {
      viewer.orbitControls.target.copy(center);
      viewer.orbitControls.update();
    }
    window.fitDone = true;
  } catch (e) {
    window.fitError = String(e && e.message || e);
  }

  window.sceneReady = true;
}).catch(err => {
  window.sceneError = String(err);
  document.getElementById('tip').textContent = '加载失败: ' + err;
});
</script>
</body>
</html>
